# Reproduces arhcl_vqe_excited1.py (group: excited_twolocal).
# Generated from the original script by tools/verify_configs.py --generate.
# Run with: python scripts/run_dvr_vqe.py configs/arhcl_vqe_excited1.yaml
group: excited_twolocal
source_script: arhcl_vqe_excited1.py
molecule: arhcl
potential_file: arhcl.txt
take_cos: true
output_root: scratch
log_dir: excited_states/arhcl_64/
excited_states: true
dvr_options: {type: jacobi, J: 0, N_R: 50, N_theta: 4, l: 1, K_max: 0, r_min: 3, r_max: 7, trunc: 0}
vqe_options:
  optimizers: [COBYLA.8000, L_BFGS_B.8000, SLSQP.1000]
  repeats: 10
  seed: 42
ansatz_options:
  type: twolocal
  rotation_blocks: [ry]
  entanglement_blocks: cx
  entanglement: linear
  reps: 1
