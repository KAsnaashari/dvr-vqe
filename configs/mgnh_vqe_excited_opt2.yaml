# Reproduces mgnh_vqe_excited_opt2.py (group: excited_opt).
# Generated from the original script by tools/verify_configs.py --generate.
# Run with: python scripts/run_dvr_vqe.py configs/mgnh_vqe_excited_opt2.yaml
group: excited_opt
source_script: mgnh_vqe_excited_opt2.py
molecule: mgnh
potential_file: mgnh.txt
take_cos: false
output_root: results
log_dir: excited_states/
excited_states: true
save_opt_params: excited_states/mgnh_twolocal_opt_4/opt_params.npz
dvr_options: {type: jacobi, N_R: 20, N_theta: 4, l: 1, K_max: 0, r_min: 3, r_max: 6, trunc: 0, J: 0}
vqe_options:
  optimizers: [L_BFGS_B.8000]
  repeats: 10
  beta: [1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000]
  seed: 42
ansatz_options:
  type: twolocal
  entanglement: opt
  gates: [39, 4, 21, 8, 13, 19, 7, 34, 30, 14]
  reps: 4
