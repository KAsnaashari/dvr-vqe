# Reproduces arhcl_vqe_greedy.py (group: greedy).
# Generated from the original script by tools/verify_configs.py --generate.
# Run with: python scripts/run_dvr_vqe.py configs/arhcl_vqe_greedy.yaml
group: greedy
source_script: arhcl_vqe_greedy.py
molecule: arhcl
potential_file: arhcl.txt
take_cos: true
output_root: scratch
log_dir: greedy_circuits/
excited_states: false
dvr_options: {type: jacobi, N_R: 35, N_theta: 4, l: 1, K_max: 0, r_min: 3.4, r_max: 5, trunc: 0, J: 0}
vqe_options:
  optimizers: [SLSQP.1000]
  repeats: 5
  seed: 42
ansatz_options: {type: greedy, layers: 12, add_h: true, add_rs: true, samples: 20, num_keep: 5, max_gate: 3,
  num_qubits: 5}
