# Quick start: smallest end-to-end DVR-VQE run (under a minute on a laptop).
# Cr2 (S = 13) vibrational ground state with the same 16-point 1D DVR as
# configs/cr2_13_vqe_excited.yaml (4 qubits), a two-layer TwoLocal ansatz and
# a noiseless L-BFGS-B optimisation.
# Run with: python scripts/run_dvr_vqe.py configs/quickstart.yaml --exact
group: quickstart
molecule: cr2
spin: 13
output_root: scratch
log_dir: quickstart/
excited_states: false
dvr_options:
  type: 1d
  box_lims: [5.2, 9]
  dx: 0.2375
  count: 16
vqe_options:
  optimizers: [L_BFGS_B.1000]
  repeats: 1
  seed: 42
ansatz_options:
  type: twolocal
  rotation_blocks: [ry]
  entanglement_blocks: cx
  entanglement: linear
  reps: 2
