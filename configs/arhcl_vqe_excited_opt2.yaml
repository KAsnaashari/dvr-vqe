# Reproduces arhcl_vqe_excited_opt2.py (group: excited_opt).
# Generated from the original script by tools/verify_configs.py --generate.
# Run with: python scripts/run_dvr_vqe.py configs/arhcl_vqe_excited_opt2.yaml
group: excited_opt
source_script: arhcl_vqe_excited_opt2.py
molecule: arhcl
potential_file: arhcl.txt
take_cos: true
output_root: results
log_dir: excited_states/
excited_states: true
dvr_options: {type: jacobi, N_R: 35, N_theta: 4, l: 1, K_max: 0, r_min: 3.4, r_max: 5, trunc: 0, J: 0}
vqe_options:
  optimizers: [L_BFGS_B.8000]
  repeats: 10
  beta: [1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000]
  seed: 42
ansatz_options:
  type: twolocal
  entanglement: opt
  gates: [34, 31, 0, 17, 1, 28, 9, 10, 2]
  reps: 4
