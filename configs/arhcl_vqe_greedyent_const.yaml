# Reproduces arhcl_vqe_greedyent_const.py (group: greedyent_const).
# Generated from the original script by tools/verify_configs.py --generate.
# Run with: python scripts/run_dvr_vqe.py configs/arhcl_vqe_greedyent_const.yaml
group: greedyent_const
source_script: arhcl_vqe_greedyent_const.py
molecule: arhcl
potential_file: arhcl.txt
take_cos: true
output_root: results
log_dir: greedyent_circuits/arhcl/
excited_states: false
dvr_options: {type: jacobi, N_R: 35, N_theta: 4, l: 1, K_max: 0, r_min: 3.4, r_max: 5, trunc: 0, J: 0}
vqe_options:
  optimizers: [L_BFGS_B.8000, SLSQP.1000]
  repeats: 5
  seed: 42
ansatz_options:
  type: greedyent
  constructive: true
  layers: 10
  num_keep: 1
  num_qubits: 5
  reps: 1
  partitions:
  - [0, 1, 2, 3, 4]
